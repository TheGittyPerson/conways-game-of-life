[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cgol"
version = "1.0.0"
description = "A simple Conway's Game of Life simulator in Python"
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pygame-ce>=2.5.0", # Add your minimum required version here
]

[project.scripts]
conway-life = "cgol.__main__:main"
